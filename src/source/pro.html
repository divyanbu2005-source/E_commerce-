<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Resume Builder</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 600px;
            background: white;
            padding: 20px;
            margin: 50px auto;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            border-radius: 10px;
        }
        input, textarea {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        button {
            width: 100%;
            padding: 10px;
            background: #007BFF;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background: #0056b3;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>AI Resume Builder</h2>
        <input type="text" id="name" placeholder="Full Name">
        <input type="email" id="email" placeholder="Email">
        <input type="text" id="phone" placeholder="Phone Number">
        <textarea id="summary" placeholder="Summary"></textarea>
        <textarea id="skills" placeholder="Skills (comma-separated)"></textarea>
        <textarea id="experience" placeholder="Work Experience"></textarea>
        <textarea id="education" placeholder="Education"></textarea>
        <button onclick="generateResume()">Generate Resume</button>
    </div>
    <script>
        function generateResume() {
            alert("Resume Generated! Check Console.");
            console.log({
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                phone: document.getElementById('phone').value,
                summary: document.getElementById('summary').value,
                skills: document.getElementById('skills').value,
                experience: document.getElementById('experience').value,
                education: document.getElementById('education').value
            });
        }
    </script>
</body>
</html>
